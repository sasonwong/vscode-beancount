name: build-vsix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx @vscode/vsce package --out vscode-beancount.vsix
      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: vscode-beancount.vsix
          path: vscode-beancount.vsix
